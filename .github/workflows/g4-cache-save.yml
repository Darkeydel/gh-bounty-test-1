name: g4-cache-save
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - name: write marker
        run: |
          echo "cache-from-public-run=$GITHUB_RUN_ID" > /tmp/g4-cache-marker.txt
          cat /tmp/g4-cache-marker.txt
      - name: save cache
        uses: actions/cache@v4
        with:
          path: /tmp/g4-cache-marker.txt
          key: g4-cache-probe-v1
      - name: list caches via API
        run: |
          curl -sS -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/Darkeydel/gh-bounty-test-1/actions/caches?per_page=10" | python3 -c 'import sys,json;d=json.load(sys.stdin);[print(a["id"],a["key"],a["ref"],a["size_in_bytes"],a["created_at"],a["last_accessed_at"]) for a in d.get("actions_caches",[])]'
