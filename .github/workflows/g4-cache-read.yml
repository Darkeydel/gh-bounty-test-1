name: g4-cache-read
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: restore cache (same repo control)
        id: cache
        uses: actions/cache@v4
        with:
          path: /tmp/g4-cache-marker.txt
          key: g4-cache-probe-v1
      - name: report
        run: |
          echo "cache_hit=${{ steps.cache.outputs.cache-hit }}"
          if [ -f /tmp/g4-cache-marker.txt ]; then echo "FILE_CONTENT=$(cat /tmp/g4-cache-marker.txt)"; else echo "NO_FILE_ON_RESTORE"; fi
