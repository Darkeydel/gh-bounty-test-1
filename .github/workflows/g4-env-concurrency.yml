name: g4-env-concurrency
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  envjob:
    runs-on: ubuntu-latest
    environment: box-env
    concurrency:
      group: g4-box-env-concurrency
      cancel-in-progress: false
    steps:
      - name: environment+concurrency probe
        run: |
          echo "run=$GITHUB_RUN_ID env-gate=box-env acquired"
          echo "env name: $GITHUB_ENV_NAME"
          echo "sha: $GITHUB_SHA"
          sleep 40
