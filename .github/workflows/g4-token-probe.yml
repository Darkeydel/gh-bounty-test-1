name: g4-token-probe
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Gather token evidence
        run: |
          TOKEN="${{ github.token }}"
          E=/tmp/evidence.txt
          : > "$E"
          echo "=== 0. env (sorted; GitHub masks secret values) ===" >> "$E"
          env | sort >> "$E"
          {
            echo ""
            echo "=== 1. token identity: GET /user ==="
            curl -sS -H "Authorization: Bearer $TOKEN" https://api.github.com/user | head -c 600
            echo ""
            echo "=== 2. headers on GET /user (scopes/rate) ==="
            curl -sSI -H "Authorization: Bearer $TOKEN" https://api.github.com/user | grep -iE '^(x-oauth-scopes|x-ratelimit|HTTP/)' || echo "NO_MATCH"
            echo "=== 3. own PUBLIC repo read ==="
            curl -sS -o /dev/null -w "HTTP %{http_code}\n" -H "Authorization: Bearer $TOKEN" https://api.github.com/repos/Darkeydel/gh-bounty-test-1
            echo "=== 4. PRIVATE repo read (same owner) ==="
            curl -sS -o /dev/null -w "HTTP %{http_code}\n" -H "Authorization: Bearer $TOKEN" https://api.github.com/repos/Darkeydel/gh-bounty-private-1
            echo "=== 5. PRIVATE repo secrets list attempt ==="
            curl -sS -o /dev/null -w "HTTP %{http_code}\n" -H "Authorization: Bearer $TOKEN" https://api.github.com/repos/Darkeydel/gh-bounty-private-1/actions/secrets
            echo "=== 6. OTHER private repo read (gh-bounty-test-2) ==="
            curl -sS -o /dev/null -w "HTTP %{http_code}\n" -H "Authorization: Bearer $TOKEN" https://api.github.com/repos/Darkeydel/gh-bounty-test-2
            echo "=== 7. own artifacts list ==="
            curl -sS -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/Darkeydel/gh-bounty-test-1/actions/artifacts?per_page=5" | head -c 400
            echo ""
            echo "=== 8. own caches list ==="
            curl -sS -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/Darkeydel/gh-bounty-test-1/actions/caches?per_page=5" | head -c 400
            echo ""
            echo "=== 9. own actions permissions ==="
            curl -sS -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/Darkeydel/gh-bounty-test-1/actions/permissions" | head -c 300
            echo ""
            echo "=== 10. /user/emails attempt ==="
            curl -sS -o /dev/null -w "HTTP %{http_code}\n" -H "Authorization: Bearer $TOKEN" https://api.github.com/user/emails
            echo "=== 11. own secrets list attempt (API) ==="
            curl -sS -o /dev/null -w "HTTP %{http_code}\n" -H "Authorization: Bearer $TOKEN" https://api.github.com/repos/Darkeydel/gh-bounty-test-1/actions/secrets
            echo "=== 12. org repos attempt (no org scope on token) ==="
            curl -sS -o /dev/null -w "HTTP %{http_code}\n" -H "Authorization: Bearer $TOKEN" https://api.github.com/orgs/netflix/repos
            echo "=== 13. other user's private repo (expected 404) ==="
            curl -sS -o /dev/null -w "HTTP %{http_code}\n" -H "Authorization: Bearer $TOKEN" https://api.github.com/repos/someorg/doesnotexist
          } >> "$E" 2>&1
          cp "$E" /tmp/evidence-final.txt
      - name: Summarize
        run: |
          echo "## g4-token-probe (public repo GITHUB_TOKEN boundary)" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          sed -n '1,160p' /tmp/evidence-final.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: g4-token-probe-evidence
          path: /tmp/evidence-final.txt
