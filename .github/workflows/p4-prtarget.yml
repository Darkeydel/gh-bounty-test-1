name: p4-prtarget
on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  actions: read
  contents: read

jobs:
  prtarget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: restore default-branch cache main-cache-Y from pull_request_target context
        id: r1
        uses: actions/cache/restore@v6
        with:
          path: /tmp/p4-main-marker.txt
          key: main-cache-Y
      - name: attempt save prtarget-cache-Z (default-branch scope, untrusted trigger)
        id: save1
        continue-on-error: true
        run: |
          echo "PRTARGET-POISON-ATTEMPT-${GITHUB_RUN_ID}" > /tmp/p4-prtarget-marker.txt
          echo "saved-marker-content=$(cat /tmp/p4-prtarget-marker.txt)"
      - name: explicit save attempt via actions/cache/save
        id: save2
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: /tmp/p4-prtarget-marker.txt
          key: prtarget-cache-Z
      - name: token scopes + permissions dump
        run: |
          TOKEN="${{ github.token }}"
          E=/tmp/p4-prtarget-evidence.txt
          : > "$E"
          echo "event=${{ github.event_name }} fork=${{ github.event.pull_request.head.repo.fork }}" | tee -a "$E"
          echo "=== GET /user ===" | tee -a "$E"
          curl -si -H "Authorization: Bearer $TOKEN" "https://api.github.com/user" | grep -iE '^(HTTP|x-oauth-scopes|x-accepted-oauth-scopes|^\{)' | sed -E 's/"([^"]*token[^"]*)"/"<redacted>"/gi' | tee -a "$E"
          echo "=== GET /repos permissions ===" | tee -a "$E"
          curl -sS -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/Darkeydel/gh-bounty-test-1" | python3 -c 'import sys,json;d=json.load(sys.stdin);print("permissions:",d.get("permissions"));print("owner:",d["owner"]["login"],"owner_id:",d["owner"]["id"])' | tee -a "$E"
          echo "=== GET /repos contents write attempt on PR branch (no-op target file) ===" | tee -a "$E"
          curl -sS -o /dev/null -w "status=%{http_code}\n" -X PUT -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/Darkeydel/gh-bounty-test-1/contents/p4-token-write-probe.txt" -d "{\"message\":\"p4 token write probe\",\"content\":\"$(printf 'probe' | base64)\",\"branch\":\"${{ github.head_ref }}\"}" | tee -a "$E"
          echo "=== cache list via API (default branch ref) ===" | tee -a "$E"
          curl -sS -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/Darkeydel/gh-bounty-test-1/actions/caches?ref=refs/heads/main&per_page=20" | python3 -c 'import sys,json;d=json.load(sys.stdin);[print(a["id"],a["key"],a["ref"],a["created_at"]) for a in d.get("actions_caches",[])]' | tee -a "$E"
          cp "$E" /tmp/p4-prtarget-evidence-final.txt
      - name: report restore result
        run: |
          E=/tmp/p4-prtarget-evidence-final.txt
          echo "restore main-cache-Y hit='${{ steps.r1.outputs.cache-hit }}' matched='${{ steps.r1.outputs.cache-matched-key }}'" | tee -a "$E"
          if [ -f /tmp/p4-main-marker.txt ]; then echo "restore FILE=$(cat /tmp/p4-main-marker.txt)" | tee -a "$E"; else echo "restore NO_FILE" | tee -a "$E"; fi
          echo "save1 marker: $(cat /tmp/p4-prtarget-marker.txt 2>/dev/null || echo absent)" | tee -a "$E"
      - name: upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-prtarget-evidence
          path: /tmp/p4-prtarget-evidence-final.txt
