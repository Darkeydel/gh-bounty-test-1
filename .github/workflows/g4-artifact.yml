name: g4-artifact
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  art:
    runs-on: ubuntu-latest
    steps:
      - name: make artifact
        run: |
          echo "g4-artifact-probe run=$GITHUB_RUN_ID" > g4-artifact-probe.txt
          echo "public-artifact-content" >> g4-artifact-probe.txt
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: g4-artifact-probe
          path: g4-artifact-probe.txt
      - name: artifact API probes
        run: |
          TOKEN="${{ github.token }}"
          E=/tmp/api.txt
          : > "$E"
          AID=$(curl -sS -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/Darkeydel/gh-bounty-test-1/actions/runs/$GITHUB_RUN_ID/artifacts" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d["artifacts"][0]["id"])')
          echo "artifact_id=$AID" | tee -a "$E"
          echo "=== run-scoped artifacts list ===" | tee -a "$E"
          curl -sS -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/Darkeydel/gh-bounty-test-1/actions/runs/$GITHUB_RUN_ID/artifacts" >> "$E"
          echo "" | tee -a "$E"
          echo "=== repo-scoped artifacts list (id + url + created) ===" | tee -a "$E"
          curl -sS -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/Darkeydel/gh-bounty-test-1/actions/artifacts?per_page=10" | python3 -c 'import sys,json;d=json.load(sys.stdin);[print(a["id"],a["name"],a["expired"],a["size_in_bytes"],a["created_at"]) for a in d.get("artifacts",[])]' >> "$E"
          echo "=== zip endpoint response headers (Location host; query sig redacted) ===" | tee -a "$E"
          curl -sSI -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/Darkeydel/gh-bounty-test-1/actions/artifacts/$AID/zip" | grep -iE '^(HTTP|location|content-type|content-length)' | sed -E 's/(sig|se|sp|sv|si|sr|spr|skoid|sktid|skv|ske|sks|skver)=[^&" ]+/\1=<redacted>/g' | tee -a "$E"
          echo "" | tee -a "$E"
          echo "=== archive_download_url for the run ===" | tee -a "$E"
          curl -sS -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/Darkeydel/gh-bounty-test-1/actions/runs/$GITHUB_RUN_ID" | python3 -c 'import sys,json;d=json.load(sys.stdin);print("archive_download_url:",d.get("archive_download_url"))' >> "$E"
          echo "" | tee -a "$E"
          echo "=== unauthenticated artifact zip status ===" | tee -a "$E"
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" "https://api.github.com/repos/Darkeydel/gh-bounty-test-1/actions/artifacts/$AID/zip" >> "$E"
          cp "$E" /tmp/api.txt
      - name: Upload API evidence
        uses: actions/upload-artifact@v4
        with:
          name: g4-artifact-api-evidence
          path: /tmp/api.txt
