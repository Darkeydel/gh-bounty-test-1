name: p4-artifact-trust
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  trust:
    runs-on: ubuntu-latest
    steps:
      - name: create trusted artifact content
        run: |
          echo "TRUSTED-SHARED-NAME-${GITHUB_RUN_ID}" > /tmp/p4-shared.txt
          echo "TRUSTED-PUBLIC-ARTIFACT-${GITHUB_RUN_ID}" > /tmp/p4-public.txt
      - name: upload shared-name artifact (trusted content)
        uses: actions/upload-artifact@v4
        with:
          name: shared-name
          path: /tmp/p4-shared.txt
      - name: upload p4-public-artifact
        uses: actions/upload-artifact@v4
        with:
          name: p4-public-artifact
          path: /tmp/p4-public.txt
      - name: download shared-name from OWN run (verify run-scoping, not PR's copy)
        uses: actions/download-artifact@v4
        with:
          name: shared-name
          path: /tmp/p4-dl-own
      - name: record artifact binding + zip URL structure
        run: |
          TOKEN="${{ github.token }}"
          E=/tmp/p4-artifact-trust-evidence.txt
          : > "$E"
          echo "downloaded own-run shared-name: $(cat /tmp/p4-dl-own/shared-name 2>/dev/null || cat /tmp/p4-dl-own/* 2>/dev/null || echo MISSING)" | tee -a "$E"
          echo "=== archive_download_url for trusted run ===" | tee -a "$E"
          curl -sS -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/Darkeydel/gh-bounty-test-1/actions/runs/$GITHUB_RUN_ID" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d.get("archive_download_url"))' | tee -a "$E"
          echo "=== artifact zip Location (signed URL host + path structure; query redacted) ===" | tee -a "$E"
          AID=$(curl -sS -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/Darkeydel/gh-bounty-test-1/actions/runs/$GITHUB_RUN_ID/artifacts" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d["artifacts"][0]["id"])')
          echo "first_artifact_id=$AID" | tee -a "$E"
          curl -sSI -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/Darkeydel/gh-bounty-test-1/actions/artifacts/$AID/zip" | grep -iE '^(HTTP|location)' | sed -E 's/\?(sig|se|sp|sv|si|sr|spr|skoid|sktid|skv|ske|sks|sv)=[^&" ]+/?\1=<redacted>/g' | tee -a "$E"
          echo "=== artifact IDs in this run ===" | tee -a "$E"
          curl -sS -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/Darkeydel/gh-bounty-test-1/actions/runs/$GITHUB_RUN_ID/artifacts" | python3 -c 'import sys,json;d=json.load(sys.stdin);[print(a["id"],a["name"],a["size_in_bytes"],a["created_at"]) for a in d.get("artifacts",[])]' | tee -a "$E"
          cp "$E" /tmp/p4-artifact-trust-evidence-final.txt
      - name: upload trust evidence
        uses: actions/upload-artifact@v4
        with:
          name: p4-artifact-trust-evidence
          path: /tmp/p4-artifact-trust-evidence-final.txt
